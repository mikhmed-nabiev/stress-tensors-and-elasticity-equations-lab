[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperfit"
version = "0.1.0"
description = "Identification of hyperelastic strain energy models from three data sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "sympy>=1.13",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "torch>=2.4",
    "cma>=4.0",
    "deap>=1.4",
    "zss>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "hyperfit[jupyter]"]
jupyter = ["jupyter>=1.0", "nbconvert>=7.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "N", "UP", "B"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
